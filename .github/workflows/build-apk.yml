name: Gerar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          mkdir -p projeto
          unzip -q riquezas-da-africa-apk-github.zip -d projeto

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ver estrutura do projeto
        run: |
          echo "=== CONTEÚDO DE projeto ==="
          find projeto -maxdepth 3 -type f | sort
          echo "=== PACKAGE.JSON ==="
          find projeto -name package.json -print

      - name: Instalar dependências
        run: |
          PASTA=$(dirname "$(find projeto -name package.json -print -quit)")
          cd "$PASTA"
          npm install --legacy-peer-deps --include=dev --no-audit --no-fund
          npm install --save-dev vite@5.0.7 @vitejs/plugin-react@4.3.4 --legacy-peer-deps --no-audit --no-fund
