name: Gerar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          mkdir -p projeto
          unzip -q riquezas-da-africa-apk-github.zip -d projeto

      - name: Mostrar package.json
        run: |
          echo "=== PACKAGE.JSON ==="
          cat projeto/package.json

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        working-directory: projeto
        run: |
          npm install --legacy-peer-deps --include=dev --no-audit --no-fund
          npm install vite@5.0.7 @vitejs/plugin-react@4.3.4 --save-dev --legacy-peer-deps --no-audit --no-fund

      - name: Verificar Vite
        working-directory: projeto
        run: |
          echo "=== VITE ==="
          ls -la node_modules/.bin/vite || true
          echo "=== VERS
