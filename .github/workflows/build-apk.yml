name: Gerar APK - Riquezas da Africa

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ============================================================
      # 1. Baixar o repositório
      # ============================================================
      - name: Baixar projeto
        uses: actions/checkout@v4

      # ============================================================
      # 2. Preparar o projeto
      # ============================================================
      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          echo "Conteúdo do repositório:"
          ls -la

          # Se já houver package.json na raiz, usa o projeto diretamente.
          if [ -f package.json ]; then
            echo "Projeto encontrado diretamente na raiz."

          else
            echo "package.json não está na raiz."
            echo "Procurando ZIP..."

            ZIP=$(find . -maxdepth 3 -type f -name "*.zip" | head -n 1)

            if [ -z "$ZIP" ]; then
              echo "ERRO: nenhum arquivo ZIP foi encontrado."
              exit 1
            fi

            echo "ZIP encontrado: $ZIP"

            # Pasta temporária
            rm -rf _projeto
            mkdir -p _projeto

            # Extrair ZIP
            unzip -q "$ZIP" -d _projeto

            echo "Procurando package.json dentro do ZIP..."

            PACKAGE_JSON=$(find _projeto -type f -name "package.json" | head -n 1)

            if [ -z "$PACKAGE_JSON" ]; then
              echo "ERRO: package.json não encontrado dentro do ZIP."
              echo "Arquivos encontrados:"
              find _projeto -maxdepth 4 -type f
              exit 1
            fi

            PROJECT_DIR=$(dirname "$PACKAGE_JSON")

            echo "Projeto encontrado em:"
            echo "$PROJECT_DIR"

            # Remover arquivos antigos da raiz.
            # Mantém .git, o ZIP e a pasta temporária.
            find . -maxdepth 1 -mindepth 1 \
              ! -name ".git" \
              ! -name "$(basename "$ZIP")" \
              ! -name "_projeto" \
              -exec rm -rf {} +

            # Copiar o projeto da V2 para a raiz
            cp -a "$PROJECT_DIR"/. .

            # Remover temporários
            rm -rf _projeto

            echo "Projeto V2 colocado na raiz."
          fi

          # ========================================================
          # Verificar arquivos essenciais
          # ========================================================

          echo "Verificando arquivos principais..."

          test -f package.json
          test -f src/main.jsx
          test -f src/styles.css
          test -f public/world-map.svg
          test -f public/icons/icon-512.png

          echo "Tudo certo."

      # ============================================================
      # 3. Configurar Node.js
      # ============================================================
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ============================================================
      # 4. Instalar dependências
      # ============================================================
      - name: Instalar dependencias
        shell: bash
        run: |
          set -e

          rm -rf node_modules
          rm -f package-lock.json

          echo "Instalando dependências..."

          npm install \
            --include=dev \
            --legacy-peer-deps \
            --no-audit \
            --no-fund

          echo "Garantindo versões do Vite..."

          npm install \
            vite@6.0.7 \
            @vitejs/plugin-react@4.3.4 \
            --save-dev \
            --legacy-peer-deps \
            --no-audit \
            --no-fund

          echo "Dependências instaladas."

      # ============================================================
      # 5. Gerar site
      # ============================================================
      - name: Gerar site
        run: |
          npm run build

      # ============================================================
      # 6. Configurar Java
      # ============================================================
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ============================================================
      # 7. Configurar Android SDK
      # ============================================================
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      # ============================================================
      # 8. Instalar componentes Android
      # ============================================================
      - name: Instalar componentes Android
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK configurado."

      # ============================================================
      # 9. Criar projeto Android
      # ============================================================
      - name: Criar projeto Android
        run: |
          npx cap add android

      # ============================================================
      # 10. Sincronizar Capacitor
      # ============================================================
      - name: Sincronizar Capacitor
        run: |
          npx cap sync android

      # ============================================================
      # 11. Aplicar identidade e ícone
      # ============================================================
      - name: Aplicar identidade Android
        shell: bash
        run: |
          set -e

          RES="android/app/src/main/res"

          echo "Criando pastas dos ícones..."

          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          test -f public/icons/icon-512.png

          echo "Gerando ícones..."

          magick public/icons/icon-512.png \
            -resize 48x48 \
            "$RES/mipmap-mdpi/ic_launcher.png"

          magick public/icons/icon-512.png \
            -resize 72x72 \
            "$RES/mipmap-hdpi/ic_launcher.png"

          magick public/icons/icon-512.png \
            -resize 96x96 \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          magick public/icons/icon-512.png \
            -resize 144x144 \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          magick public/icons/icon-512.png \
            -resize 192x192 \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"

          # Ícones redondos
          cp "$RES/mipmap-mdpi/ic_launcher.png" \
             "$RES/mipmap-mdpi/ic_launcher_round.png"

          cp "$RES/mipmap-hdpi/ic_launcher.png" \
             "$RES/mipmap-hdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xhdpi/ic_launcher.png" \
             "$RES/mipmap-xhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

          # Nome do aplicativo
          STRINGS="android/app/src/main/res/values/strings.xml"

          sed -i \
            's#<string name="app_name">.*</string>#<string name="app_name">Riquezas da África</string>#' \
            "$STRINGS"

          echo "Identidade Android aplicada."

      # ============================================================
      # 12. Verificar Android
      # ============================================================
      - name: Verificar arquivos Android
        shell: bash
        run: |
          set -e

          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          test -f android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          test -f android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          grep -q "Riquezas da África" \
            android/app/src/main/res/values/strings.xml

          echo "Todos os arquivos Android estão corretos."

      # ============================================================
      # 13. Gerar APK
      # ============================================================
      - name: Gerar APK
        working-directory: android
        shell: bash
        run: |
          set -e

          echo "Iniciando compilação do APK..."

          ./gradlew assembleDebug --no-daemon

          echo "APK compilado."

      # ============================================================
      # 14. Renomear APK
      # ============================================================
      - name: Renomear APK
        shell: bash
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          cp "$APK" Riquezas-da-Africa.apk

          echo "APK final:"
          ls -lh Riquezas-da-Africa.apk

      # ============================================================
      # 15. Disponibilizar APK
      # ============================================================
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Riquezas-da-Africa
          path: Riquezas-da-Africa.apk
          if-no-files-found: error
