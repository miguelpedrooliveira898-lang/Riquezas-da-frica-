name: Gerar APK - Riquezas da Africa

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # ============================================================
      # 1. Baixar o repositório
      # ============================================================
      - name: Baixar projeto
        uses: actions/checkout@v4

      # ============================================================
      # 2. Preparar o projeto
      #
      # Se o projeto estiver dentro de um ZIP, o ZIP será extraído.
      # Isso permite manter o ZIP no GitHub sem precisar enviar
      # dezenas de arquivos/pastas pelo celular.
      # ============================================================
      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          echo "Arquivos encontrados no repositório:"
          ls -la

          # Se já existir um package.json na raiz, usamos o projeto
          # normalmente.
          if [ -f package.json ]; then
            echo "package.json encontrado na raiz."
            echo "Projeto já está pronto para compilação."

          else
            echo "package.json não encontrado na raiz."
            echo "Procurando um arquivo ZIP..."

            ZIP=$(find . -maxdepth 3 -type f \
              -name "*.zip" -o -name "riquezas-da-africa-apk-github.zip" \
              | head -n 1)

            if [ -z "$ZIP" ]; then
              echo "ERRO: nenhum ZIP do projeto foi encontrado."
              exit 1
            fi

            echo "ZIP encontrado:"
            echo "$ZIP"

            # Criar pasta temporária
            rm -rf _projeto
            mkdir -p _projeto

            # Extrair
            unzip -q "$ZIP" -d _projeto

            echo "Conteúdo extraído:"
            find _projeto -maxdepth 3 -type f | head -n 100

            # Procurar onde está o package.json
            PROJECT_DIR=$(find _projeto -type f -name "package.json" \
              -printf '%h\n' | head -n 1)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERRO: package.json não foi encontrado dentro do ZIP."
              exit 1
            fi

            echo "Pasta do projeto:"
            echo "$PROJECT_DIR"

            # Limpar tudo da raiz, preservando .git e o ZIP.
            find . -maxdepth 1 \
              ! -name "." \
              ! -name ".git" \
              ! -name "_projeto" \
              -exec rm -rf {} +

            # Copiar o projeto extraído para a raiz
            cp -a "$PROJECT_DIR"/. .

            # Remover pasta temporária
            rm -rf _projeto

            echo "Projeto preparado."
          fi

          # ========================================================
          # Verificações
          # ========================================================

          test -f package.json
          test -f src/main.jsx
          test -f src/styles.css
          test -f public/world-map.svg

          echo "Arquivos principais encontrados."
          echo "package.json:"
          cat package.json

      # ============================================================
      # 3. Configurar Node.js
      # ============================================================
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ============================================================
      # 4. Instalar dependências
      # ============================================================
      - name: Instalar dependencias
        shell: bash
        run: |
          set -e

          rm -rf node_modules
          rm -f package-lock.json

          npm install \
            --include=dev \
            --legacy-peer-deps \
            --no-audit \
            --no-fund

          npm install \
            vite@6.0.7 \
            @vitejs/plugin-react@4.3.4 \
            --save-dev \
            --legacy-peer-deps \
            --no-audit \
            --no-fund

      # ============================================================
      # 5. Gerar versão Web
      # ============================================================
      - name: Gerar site
        run: npm run build

      # ============================================================
      # 6. Configurar Java
      # ============================================================
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ============================================================
      # 7. Configurar Android SDK
      # ============================================================
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      # ============================================================
      # 8. Instalar componentes Android
      # ============================================================
      - name: Instalar componentes Android
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ============================================================
      # 9. Criar projeto Android
      # ============================================================
      - name: Criar projeto Android
        run: npx cap add android

      # ============================================================
      # 10. Sincronizar Capacitor
      # ============================================================
      - name: Sincronizar Capacitor
        run: npx cap sync android

      # ============================================================
      # 11. Aplicar identidade e ícone do aplicativo
      # ============================================================
      - name: Aplicar identidade Android
        shell: bash
        run: |
          set -e

          RES="android/app/src/main/res"

          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          # Verificar se o ícone existe
          test -f public/icons/icon-512.png

          # Gerar ícones para as diferentes densidades
          for spec in \
            "mdpi:48" \
            "hdpi:72" \
            "xhdpi:96" \
            "xxhdpi:144" \
            "xxxhdpi:192"
          do
            density="${spec%%:*}"
            size="${spec##*:}"

            echo "Gerando ícone ${density}: ${size}x${size}"

            magick public/icons/icon-512.png \
              -resize "${size}x${size}" \
              "$RES/mipmap-$density/ic_launcher.png"

            magick public/icons/icon-512.png \
              -resize "${size}x${size}" \
              "$RES/mipmap-$density/ic_launcher_round.png"
          done

          # Nome do aplicativo
          STRINGS="android/app/src/main/res/values/strings.xml"

          if grep -q '<string name="app_name">' "$STRINGS"; then
            sed -i \
              's#<string name="app_name">.*</string>#<string name="app_name">Riquezas da África</string>#' \
              "$STRINGS"
          else
            sed -i \
              '/<\/resources>/i\    <string name="app_name">Riquezas da África</string>' \
              "$STRINGS"
          fi

          echo "Identidade Android aplicada."

      # ============================================================
      # 12. Verificar arquivos Android
      # ============================================================
      - name: Verificar arquivos principais
        shell: bash
        run: |
          set -e

          testname: Gerar APK - Riquezas da Africa

