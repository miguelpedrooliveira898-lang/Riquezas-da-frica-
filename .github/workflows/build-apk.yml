name: Build APK - Riquezas da África V8

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # ============================================================
      # 1. BAIXAR O REPOSITÓRIO
      # ============================================================
      - name: Baixar projeto
        uses: actions/checkout@v4

      # ============================================================
      # 2. PREPARAR O PROJETO
      # ============================================================
      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "ARQUIVOS DO REPOSITÓRIO"
          echo "======================================"
          ls -la

          # Procura um ZIP na raiz do repositório.
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1 || true)

          if [ -n "$ZIP_FILE" ]; then
            echo ""
            echo "ZIP encontrado:"
            echo "$ZIP_FILE"

            mkdir -p _project
            unzip -o "$ZIP_FILE" -d _project

            # Procura o package.json dentro do ZIP.
            PROJECT_DIR=$(find _project \
              -name package.json \
              -type f \
              -printf '%h\n' | head -n 1)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERRO: package.json não encontrado dentro do ZIP."
              exit 1
            fi

            echo ""
            echo "Pasta do projeto:"
            echo "$PROJECT_DIR"

            # Copia o projeto para a raiz.
            cp -a "$PROJECT_DIR"/. .
          fi

          echo ""
          echo "======================================"
          echo "VERIFICANDO PROJETO"
          echo "======================================"

          if [ ! -f package.json ]; then
            echo "ERRO: package.json não encontrado."
            exit 1
          fi

          if [ ! -f capacitor.config.json ]; then
            echo "ERRO: capacitor.config.json não encontrado."
            exit 1
          fi

          echo "package.json encontrado."
          echo "capacitor.config.json encontrado."

      # ============================================================
      # 3. NODE.JS
      # ============================================================
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ============================================================
      # 4. INSTALAR DEPENDÊNCIAS
      # ============================================================
      - name: Instalar dependências
        run: |
          set -e

          npm install \
            --include=dev \
            --legacy-peer-deps \
            --no-audit \
            --no-fund

      # ============================================================
      # 5. GARANTIR VITE
      # ============================================================
      - name: Garantir Vite e React
        run: |
          set -e

          npm install \
            vite@6.0.7 \
            @vitejs/plugin-react@4.3.4 \
            --save-dev \
            --legacy-peer-deps \
            --no-audit \
            --no-fund

      # ============================================================
      # 6. COMPILAR A APLICAÇÃO WEB
      # ============================================================
      - name: Compilar aplicação
        run: |
          set -e

          echo "Executando build..."

          npm run build

          if [ ! -d dist ]; then
            echo "ERRO: a pasta dist não foi criada."
            exit 1
          fi

          echo ""
          echo "Build concluído."
          ls -lah dist

      # ============================================================
      # 7. JAVA
      # ============================================================
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ============================================================
      # 8. ANDROID SDK
      # ============================================================
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: "true"
          log-accepted-android-sdk-licenses: "false"
          packages: "platform-tools"

      # ============================================================
      # 9. INSTALAR ANDROID 35
      # ============================================================
      - name: Instalar componentes Android
        run: |
          set -e

          echo "Instalando Android SDK..."

          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "Android SDK instalado."

      # ============================================================
      # 10. IMAGE MAGICK
      # ============================================================
      - name: Instalar ImageMagick
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y imagemagick

          convert --version

      # ============================================================
      # 11. CAPACITOR ANDROID
      # ============================================================
      - name: Criar projeto Android
        run: |
          set -e

          npx cap add android
          npx cap sync android

      # ============================================================
      # 12. ÍCONE DO APLICATIVO
      # ============================================================
      - name: Configurar ícone Android
        shell: bash
        run: |
          set -e

          ICON="public/icons/icon-512.png"

          if [ ! -f "$ICON" ]; then
            echo "ERRO: ícone não encontrado:"
            echo "$ICON"
            exit 1
          fi

          echo "Ícone encontrado."

          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          convert "$ICON" -resize 48x48 \
            android/app/src/main/res/mipmap-mdpi/ic_launcher.png

          convert "$ICON" -resize 72x72 \
            android/app/src/main/res/mipmap-hdpi/ic_launcher.png

          convert "$ICON" -resize 96x96 \
            android/app/src/main/res/mipmap-xhdpi/ic_launcher.png

          convert "$ICON" -resize 144x144 \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          convert "$ICON" -resize 192x192 \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png

          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png

          cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png

          cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png

          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          echo "Ícones Android criados."

      # ============================================================
      # 13. NOME DO APLICATIVO
      # ============================================================
      - name: Configurar nome do aplicativo
        run: |
          set -e

          mkdir -p android/app/src/main/res/values

          cat > android/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Riquezas da África</string>
              <string name="title_activity_main">Riquezas da África</string>
              <string name="package_name">com.riquezasdaafrica.app</string>
              <string name="custom_url_scheme">com.riquezasdaafrica.app</string>
          </resources>
          EOF

      # ============================================================
      # 14. VERIFICAR GRADLE
      # ============================================================
      - name: Verificar Gradle
        run: |
          set -e

          cd android

          chmod +x gradlew

          ./gradlew --version

      # ============================================================
      # 15. GERAR APK
      # ============================================================
      - name: Gerar APK
        run: |
          set -e

          cd android

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

      # ============================================================
      # 16. LOCALIZAR APK
      # ============================================================
      - name: Verificar APK
        shell: bash
        run: |
          set -e

          echo "Procurando APK..."

          APK=$(find android/app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não encontrado."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "APK ENCONTRADO"
          echo "======================================"

          ls -lh "$APK"

      # ============================================================
      # 17. RENOMEAR APK
      # ============================================================
      - name: Preparar APK final
        run: |
          set -e

          mkdir -p release

          APK=$(find android/app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" | head -n 1)

          cp "$APK" \
            "release/Riquezas-da-Africa-V8.apk"

          ls -lh release/

      # ============================================================
      # 18. DISPONIBILIZAR APK NO GITHUB
      # ============================================================
      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: Riquezas-da-Africa-V8
          path: release/Riquezas-da-Africa-V8.apk
          if-no-files-found: error
