name: Gerar APK - Riquezas da Africa

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar projeto
        shell: bash
        run: |
          set -e
          ls -la

          if [ -f package.json ]; then
            echo "Projeto encontrado diretamente na raiz."
          else
            ZIP=$(find . -maxdepth 3 -type f -name "*.zip" | head -n 1)

            if [ -z "$ZIP" ]; then
              echo "ERRO: nenhum arquivo ZIP foi encontrado."
              exit 1
            fi

            echo "ZIP encontrado: $ZIP"

            rm -rf _projeto
            mkdir -p _projeto
            unzip -q "$ZIP" -d _projeto

            PACKAGE_JSON=$(find _projeto -type f -name "package.json" | head -n 1)

            if [ -z "$PACKAGE_JSON" ]; then
              echo "ERRO: package.json não encontrado dentro do ZIP."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$PACKAGE_JSON")

            echo "Projeto encontrado em: $PROJECT_DIR"

            find . -maxdepth 1 -mindepth 1 \
              ! -name ".git" \
              ! -name "$(basename "$ZIP")" \
              ! -name "_projeto" \
              -exec rm -rf {} +

            cp -a "$PROJECT_DIR"/. .

            rm -rf _projeto
          fi

          test -f package.json
          test -f src/main.jsx
          test -f src/styles.css
          test -f public/world-map.svg
          test -f public/icons/icon-512.png

          echo "Projeto validado."

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        shell: bash
        run: |
          set -e

          rm -rf node_modules
          rm -f package-lock.json

          npm install \
            --include=dev \
            --legacy-peer-deps \
            --no-audit \
            --no-fund

          npm install \
            vite@6.0.7 \
            @vitejs/plugin-react@4.3.4 \
            --save-dev \
            --legacy-peer-deps \
            --no-audit \
            --no-fund

      - name: Gerar site
        run: npm run build

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Instalar ImageMagick
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y imagemagick

          convert --version

      - name: Criar projeto Android
        run: npx cap add android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Aplicar identidade Android
        shell: bash
        run: |
          set -e

          RES="android/app/src/main/res"

          mkdir -p \
            "$RES/mipmap-mdpi" \
            "$RES/mipmap-hdpi" \
            "$RES/mipmap-xhdpi" \
            "$RES/mipmap-xxhdpi" \
            "$RES/mipmap-xxxhdpi"

          test -f public/icons/icon-512.png

          convert public/icons/icon-512.png \
            -resize 48x48 \
            "$RES/mipmap-mdpi/ic_launcher.png"

          convert public/icons/icon-512.png \
            -resize 72x72 \
            "$RES/mipmap-hdpi/ic_launcher.png"

          convert public/icons/icon-512.png \
            -resize 96x96 \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          convert public/icons/icon-512.png \
            -resize 144x144 \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          convert public/icons/icon-512.png \
            -resize 192x192 \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"

          cp \
            "$RES/mipmap-mdpi/ic_launcher.png" \
            "$RES/mipmap-mdpi/ic_launcher_round.png"

          cp \
            "$RES/mipmap-hdpi/ic_launcher.png" \
            "$RES/mipmap-hdpi/ic_launcher_round.png"

          cp \
            "$RES/mipmap-xhdpi/ic_launcher.png" \
            "$RES/mipmap-xhdpi/ic_launcher_round.png"

          cp \
            "$RES/mipmap-xxhdpi/ic_launcher.png" \
            "$RES/mipmap-xxhdpi/ic_launcher_round.png"

          cp \
            "$RES/mipmap-xxxhdpi/ic_launcher.png" \
            "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

          STRINGS="android/app/src/main/res/values/strings.xml"

          sed -i \
            's#<string name="app_name">.*</string>#<string name="app_name">Riquezas da África</string>#' \
            "$STRINGS"

      - name: Verificar arquivos Android
        shell: bash
        run: |
          set -e

          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          grep -q \
            "Riquezas da África" \
            android/app/src/main/res/values/strings.xml

      - name: Gerar APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Renomear APK
        run: |
          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            Riquezas-da-Africa.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Riquezas-da-Africa
          path: Riquezas-da-Africa.apk
          if-no-files-found: error
