name: Build APK - Riquezas da África V9

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. BAIXAR O PROJETO
      # ============================================================
      - name: Baixar projeto
        uses: actions/checkout@v4

      # ============================================================
      # 2. NODE.JS
      # ============================================================
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ============================================================
      # 3. VERIFICAR PROJETO
      # ============================================================
      - name: Verificar arquivos do projeto
        run: |
          set -e

          echo "Arquivos:"
          ls -la

          test -f package.json
          test -f capacitor.config.json
          test -f public/index.html
          test -f public/world-map.svg
          test -f public/icons/icon-512.png

          echo "Arquivos principais encontrados."

      # ============================================================
      # 4. INSTALAR DEPENDÊNCIAS
      # ============================================================
      - name: Instalar dependências
        run: |
          set -e

          npm install \
            --include=dev \
            --legacy-peer-deps \
            --no-audit \
            --no-fund

      # ============================================================
      # 5. INSTALAR IMAGEMAGICK
      # ============================================================
      - name: Instalar ImageMagick
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y imagemagick

          echo "ImageMagick:"
          convert --version

      # ============================================================
      # 6. COMPILAR A APLICAÇÃO WEB
      # ============================================================
      - name: Compilar aplicação
        run: |
          set -e

          npm run build

          echo ""
          echo "Conteúdo de dist:"
          find dist -maxdepth 2 -type f | sort

          test -f dist/index.html
          test -f dist/world-map.svg
          test -f dist/icons/icon-512.png

          echo ""
          echo "Build web concluído."

      # ============================================================
      # 7. JAVA 21
      # ============================================================
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      # ============================================================
      # 8. ANDROID SDK
      # ============================================================
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: "true"
          log-accepted-android-sdk-licenses: "false"
          packages: "platform-tools"

      # ============================================================
      # 9. INSTALAR ANDROID 35
      # ============================================================
      - name: Instalar componentes Android
        run: |
          set -e

          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "Android SDK preparado."

      # ============================================================
      # 10. CRIAR PROJETO ANDROID
      # ============================================================
      - name: Criar projeto Android
        run: |
          set -e

          npx cap add android
          npx cap sync android

          echo ""
          echo "Projeto Android criado."

      # ============================================================
      # 11. INSTALAR ÍCONE PERSONALIZADO
      # ============================================================
      - name: Configurar ícone personalizado
        shell: bash
        run: |
          set -e

          ICON="public/icons/icon-512.png"
          RES="android/app/src/main/res"

          test -f "$ICON"

          echo "Ícone encontrado:"
          file "$ICON"

          # Remove os ícones adaptativos padrão criados pelo Capacitor.
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher_foreground.xml"
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher_background.xml"

          mkdir -p \
            "$RES/mipmap-mdpi" \
            "$RES/mipmap-hdpi" \
            "$RES/mipmap-xhdpi" \
            "$RES/mipmap-xxhdpi" \
            "$RES/mipmap-xxxhdpi"

          # Gera os ícones nas densidades Android.
          convert "$ICON" -resize 48x48 \
            "$RES/mipmap-mdpi/ic_launcher.png"

          convert "$ICON" -resize 72x72 \
            "$RES/mipmap-hdpi/ic_launcher.png"

          convert "$ICON" -resize 96x96 \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          convert "$ICON" -resize 144x144 \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          convert "$ICON" -resize 192x192 \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"

          # Ícones redondos.
          cp "$RES/mipmap-mdpi/ic_launcher.png" \
             "$RES/mipmap-mdpi/ic_launcher_round.png"

          cp "$RES/mipmap-hdpi/ic_launcher.png" \
             "$RES/mipmap-hdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xhdpi/ic_launcher.png" \
             "$RES/mipmap-xhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

          echo ""
          echo "Ícone personalizado instalado."

      # ============================================================
      # 12. GARANTIR NOME DO APLICATIVO
      # ============================================================
      - name: Configurar nome do aplicativo
        run: |
          set -e

          mkdir -p android/app/src/main/res/values

          cat > android/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Riquezas da África</string>
              <string name="title_activity_main">Riquezas da África</string>
              <string name="package_name">com.riquezasdaafrica.app</string>
              <string name="custom_url_scheme">com.riquezasdaafrica.app</string>
          </resources>
          EOF

          echo "Nome configurado."

      # ============================================================
      # 13. GARANTIR ÍCONE NO ANDROID MANIFEST
      # ============================================================
      - name: Configurar Android Manifest
        shell: bash
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          text = re.sub(
              r'android:icon="[^"]*"',
              'android:icon="@mipmap/ic_launcher"',
              text
          )

          if 'android:icon="@mipmap/ic_launcher"' not in text:
              text = text.replace(
                  '<application',
                  '<application android:icon="@mipmap/ic_launcher"',
                  1
              )

          text = re.sub(
              r'\s+android:roundIcon="[^"]*"',
              '',
              text
          )

          text = text.replace(
              'android:icon="@mipmap/ic_launcher"',
              'android:icon="@mipmap/ic_launcher" '
              'android:roundIcon="@mipmap/ic_launcher_round"',
              1
          )

          path.write_text(text)
          PY

          echo "Manifest configurado."

      # ============================================================
      # 14. VERIFICAR GRADLE
      # ============================================================
      - name: Preparar Gradle
        run: |
          set -e

          cd android

          chmod +x gradlew

          ./gradlew --version

      # ============================================================
      # 15. GERAR APK
      # ============================================================
      - name: Gerar APK
        run: |
          set -e

          cd android

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

      # ============================================================
      # 16. LOCALIZAR E VALIDAR APK
      # ============================================================
      - name: Validar APK
        shell: bash
        run: |
          set -e

          APK=$(find android/app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não encontrado."
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "ERRO: APK vazio."
            exit 1
          fi

          echo "APK encontrado:"
          ls -lh "$APK"

      # ============================================================
      # 17. PREPARAR ARQUIVO FINAL
      # ============================================================
      - name: Preparar APK final
        shell: bash
        run: |
          set -e

          mkdir -p release

          APK=$(find android/app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" | head -n 1)

          cp "$APK" \
            "release/Riquezas-da-Africa-V9.apk"

          echo ""
          echo "=========================================="
