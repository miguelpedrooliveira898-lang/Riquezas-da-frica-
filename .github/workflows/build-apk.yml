name: Build APK - Riquezas da África V8

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          echo "Arquivos do repositório:"
          ls -la

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1 || true)

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP encontrado: $ZIP_FILE"

            mkdir -p _project
            unzip -o "$ZIP_FILE" -d _project

            PROJECT_DIR=$(find _project \
              -name package.json \
              -type f \
              -printf '%h\n' | head -n 1)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERRO: package.json não encontrado dentro do ZIP."
              exit 1
            fi

            echo "Projeto encontrado em: $PROJECT_DIR"

            cp -a "$PROJECT_DIR"/. .
          fi

          if [ ! -f package.json ]; then
            echo "ERRO: package.json não encontrado."
            exit 1
          fi

          if [ ! -f capacitor.config.json ]; then
            echo "ERRO: capacitor.config.json não encontrado."
            exit 1
          fi

          echo "Projeto preparado."

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: |
          npm install \
            --include=dev \
            --legacy-peer-deps \
            --no-audit \
            --no-fund

      - name: Garantir Vite e React
        run: |
          npm install \
            vite@6.0.7 \
            @vitejs/plugin-react@4.3.4 \
            --save-dev \
            --legacy-peer-deps \
            --no-audit \
            --no-fund

      - name: Compilar aplicação
        run: |
          npm run build

          if [ ! -d dist ]; then
            echo "ERRO: a pasta dist não foi criada."
            exit 1
          fi

          echo "Build web concluído."

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Instalar ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Criar projeto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Configurar ícone Android
        shell: bash
        run: |
          set -e

          ICON="public/icons/icon-512.png"

          if [ ! -f "$ICON" ]; then
            echo "ERRO: $ICON não encontrado."
            exit 1
          fi

          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          convert "$ICON" -resize 48x48 \
            android/app/src/main/res/mipmap-mdpi/ic_launcher.png

          convert "$ICON" -resize 72x72 \
            android/app/src/main/res/mipmap-hdpi/ic_launcher.png

          convert "$ICON" -resize 96x96 \
            android/app/src/main/res/mipmap-xhdpi/ic_launcher.png

          convert "$ICON" -resize 144x144 \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          convert "$ICON" -resize 192x192 \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png

          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png

          cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png

          cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png

          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          echo "Ícones configurados."

      - name: Configurar nome do aplicativo
        run: |
          mkdir -p android/app/src/main/res/values

          cat > android/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Riquezas da África</string>
              <string name="title_activity_main">Riquezas da África</string>
              <string name="package_name">com.riquezasdaafrica.app</string>
              <string name="custom_url_scheme">com.riquezasdaafrica.app</string>
          </resources>
          EOF

      - name: Preparar Gradle
        run: |
          cd android
          chmod +x gradlew

      - name: Gerar APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK=$(find android/app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não encontrado."
            exit 1
          fi

          echo "APK encontrado:"
          ls -lh "$APK"

      - name: Preparar artefato
        run: |
          mkdir -p release

          APK=$(find android/app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" | head -n 1)

          cp "$APK" "release/Riquezas-da-Africa-V8.apk"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Riquezas-da-Africa-V8
          path: release/Riquezas-da-Africa-V8.apk
          if-no-files-found: error
