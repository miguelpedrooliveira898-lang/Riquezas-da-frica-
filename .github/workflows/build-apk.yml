      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "ARQUIVOS DO REPOSITÓRIO"
          echo "======================================"

          ls -la

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1 || true)

          if [ -n "$ZIP_FILE" ]; then
            echo ""
            echo "ZIP encontrado:"
            echo "$ZIP_FILE"

            rm -rf _project
            mkdir -p _project

            unzip -o "$ZIP_FILE" -d _project

            echo ""
            echo "Conteúdo extraído:"
            find _project -maxdepth 3 -type f | sort

            PROJECT_DIR=$(find _project \
              -name package.json \
              -type f \
              -printf '%h\n' | head -n 1)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERRO: package.json não encontrado."
              exit 1
            fi

            echo ""
            echo "Projeto encontrado em:"
            echo "$PROJECT_DIR"

            cp -a "$PROJECT_DIR"/. .
          fi

          echo ""
          echo "======================================"
          echo "VALIDANDO ESTRUTURA"
          echo "======================================"

          # package.json é obrigatório
          if [ ! -f package.json ]; then
            echo "ERRO: package.json não encontrado na raiz."
            exit 1
          fi

          # Capacitor é obrigatório
          if [ ! -f capacitor.config.json ]; then
            echo "ERRO: capacitor.config.json não encontrado."
            exit 1
          fi

          # O mapa precisa existir
          if [ ! -f public/world-map.svg ]; then
            echo "ERRO: public/world-map.svg não encontrado."
            exit 1
          fi

          # Ícone precisa existir
          if [ ! -f public/icons/icon-512.png ]; then
            echo "ERRO: public/icons/icon-512.png não encontrado."
            exit 1
          fi

          # A V9 enviada possui o index dentro de public.
          if [ -f public/index.html ]; then
            echo "index.html encontrado em public/."
          elif [ -f index.html ]; then
            echo "index.html encontrado na raiz."
          else
            echo "ERRO: nenhum index.html encontrado."
            exit 1
          fi

          echo ""
          echo "Estrutura validada com sucesso."
