name: Gerar APK - Riquezas da Africa

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ============================================================
      # 1. BAIXAR O PROJETO
      # ============================================================
      - name: Baixar projeto
        uses: actions/checkout@v4


      # ============================================================
      # 2. PREPARAR O PROJETO
      # ============================================================
      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          echo "Arquivos encontrados:"
          ls -la

          if [ -f package.json ]; then

            echo "Projeto encontrado diretamente na raiz."

          else

            echo "package.json não está na raiz."
            echo "Procurando ZIP..."

            ZIP=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)

            if [ -z "$ZIP" ]; then
              echo "ERRO: não encontrei package.json nem ZIP."
              exit 1
            fi

            echo "ZIP encontrado:"
            echo "$ZIP"

            rm -rf _projeto
            mkdir -p _projeto

            unzip -q "$ZIP" -d _projeto

            PACKAGE_JSON=$(find _projeto -type f -name "package.json" | head -n 1)

            if [ -z "$PACKAGE_JSON" ]; then
              echo "ERRO: package.json não encontrado dentro do ZIP."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$PACKAGE_JSON")

            echo "Projeto localizado em:"
            echo "$PROJECT_DIR"

            find . -maxdepth 1 -mindepth 1 \
              ! -name ".git" \
              ! -name "_projeto" \
              ! -name "$(basename "$ZIP")" \
              -exec rm -rf {} +

            cp -a "$PROJECT_DIR"/. .

            rm -rf _projeto

          fi

          echo "Verificando arquivos principais..."

          test -f package.json
          test -f index.html
          test -f src/main.jsx
          test -f src/styles.css
          test -f public/icons/icon-512.png

          echo "Projeto preparado."


      # ============================================================
      # 3. NODE
      # ============================================================
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      # ============================================================
      # 4. INSTALAR DEPENDÊNCIAS
      # ============================================================
      - name: Instalar dependências
        shell: bash
        run: |
          set -e

          npm install \
            --include=dev \
            --legacy-peer-deps \
            --no-audit \
            --no-fund

          npm install \
            vite@6.0.7 \
            @vitejs/plugin-react@4.3.4 \
            --save-dev \
            --legacy-peer-deps \
            --no-audit \
            --no-fund

          echo "Dependências instaladas."


      # ============================================================
      # 5. BUILD WEB
      # ============================================================
      - name: Gerar aplicação web
        shell: bash
        run: |
          set -e

          npm run build

          test -d dist

          echo "Build web concluído."


      # ============================================================
      # 6. JAVA 21
      # ============================================================
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      # ============================================================
      # 7. ANDROID SDK
      # ============================================================
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: "true"
          log-accepted-android-sdk-licenses: "false"
          packages: "platform-tools"


      # ============================================================
      # 8. INSTALAR SDK NECESSÁRIO
      # ============================================================
      - name: Instalar componentes Android
        shell: bash
        run: |
          set -e

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK preparado."


      # ============================================================
      # 9. VERIFICAR SDK
      # ============================================================
      - name: Verificar Android SDK
        shell: bash
        run: |
          set -e

          echo "Java:"
          java -version

          echo ""
          echo "ADB:"
          adb version

          echo ""
          echo "SDK:"
          sdkmanager --list_installed | head -100

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"


      # ============================================================
      # 10. IMAGEMAGICK
      # ============================================================
      - name: Instalar ImageMagick
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y imagemagick

          convert --version


      # ============================================================
      # 11. CAPACITOR
      # ============================================================
      - name: Criar projeto Android
        shell: bash
        run: |
          set -e

          npx cap add android


      - name: Sincronizar Capacitor
        shell: bash
        run: |
          set -e

          npx cap sync android


      # ============================================================
      # 12. CONFIGURAR ÍCONES
      # ============================================================
      - name: Gerar ícones Android
        shell: bash
        run: |
          set -e

          ICON="public/icons/icon-512.png"
          RES="android/app/src/main/res"

          test -f "$ICON"

          mkdir -p \
            "$RES/mipmap-mdpi" \
            "$RES/mipmap-hdpi" \
            "$RES/mipmap-xhdpi" \
            "$RES/mipmap-xxhdpi" \
            "$RES/mipmap-xxxhdpi"


          # ----------------------------
          # Ícones normais
          # ----------------------------

          convert "$ICON" \
            -resize 48x48 \
            "$RES/mipmap-mdpi/ic_launcher.png"

          convert "$ICON" \
            -resize 72x72 \
            "$RES/mipmap-hdpi/ic_launcher.png"

          convert "$ICON" \
            -resize 96x96 \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          convert "$ICON" \
            -resize 144x144 \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          convert "$ICON" \
            -resize 192x192 \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"


          # ----------------------------
          # Ícones redondos
          # ----------------------------

          cp "$RES/mipmap-mdpi/ic_launcher.png" \
             "$RES/mipmap-mdpi/ic_launcher_round.png"

          cp "$RES/mipmap-hdpi/ic_launcher.png" \
             "$RES/mipmap-hdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xhdpi/ic_launcher.png" \
             "$RES/mipmap-xhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxxhdpi/ic_launcher_round.png"


          echo "Ícones criados."


      # ============================================================
      # 13. NOME DO APP
      # ============================================================
      - name: Configurar nome do aplicativo
        shell: bash
        run: |
          set -e

          STRINGS="android/app/src/main/res/values/strings.xml"

          if [ -f "$STRINGS" ]; then

            sed -i \
              's#<string name="app_name">.*</string>#<string name="app_name">Riquezas da África</string>#' \
              "$STRINGS"

          fi

          echo "Nome do aplicativo configurado."


      # ============================================================
      # 14. VERIFICAR ÍCONES
      # ============================================================
      - name: Verificar ícones
        shell: bash
        run: |
          set -e

          for DIR in \
            mdpi \
            hdpi \
            xhdpi \
            xxhdpi \
            xxxhdpi
          do

            test -f \
              "android/app/src/main/res/mipmap-$DIR/ic_launcher.png"

            test -f \
              "android/app/src/main/res/mipmap-$DIR/ic_launcher_round.png"

          done

          echo "Todos os ícones foram verificados."


      # ============================================================
      # 15. VERIFICAR CAPACITOR
      # ============================================================
      - name: Verificar projeto Capacitor
        shell: bash
        run: |
          set -e

          test -d android
          test -f android/gradlew
          test -f android/settings.gradle

          echo "Projeto Android válido."


      # ============================================================
      # 16. GERAR APK
      # ============================================================
      - name: Gerar APK Debug
        working-directory: android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 17. VERIFICAR APK
      # ============================================================
      - name: Verificar APK gerado
        shell: bash
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK encontrado:"
          ls -lh "$APK"


      # ============================================================
      # 18. RENOMEAR APK
      # ============================================================
      - name: Preparar APK final
        shell: bash
        run: |
          set -e

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            Riquezas-da-Africa.apk

          ls -lh Riquezas-da-Africa.apk


      # ============================================================
      # 19. PUBLICAR APK
      # ============================================================
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Riquezas-da-Africa
          path: Riquezas-da-Africa.apk
          if-no-files-found: error
