name: Gerar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          mkdir projeto
          unzip -q riquezas-da-africa-apk-github.zip -d projeto

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        working-directory: projeto
        run: npm install

      - name: Gerar site
        working-directory: projeto
        run: npm run build

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Criar Android
        working-directory: projeto
        run: npx cap add android

      - name: Sincronizar
        working-directory: projeto
        run: npx cap sync android

      - name: Gerar APK
        working-directory: projeto/android
        run: ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: riquezas-da-africa-apk
          path: projeto/android/app/build/outputs/apk/debug/app-debug.apk
