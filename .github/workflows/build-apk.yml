name: Gerar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          mkdir -p projeto
          unzip -q riquezas-da-africa-apk-github.zip -d projeto

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        working-directory: projeto
        run: |
          rm -rf node_modules
          rm -f package-lock.json
          npm install --include=dev --legacy-peer-deps --no-audit --no-fund
          npm install vite@6.0.7 @vitejs/plugin-react@4.3.4 --save-dev --legacy-peer-deps --no-audit --no-fund

      - name: Gerar site
        working-directory: projeto
        run: npm run build

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Instalar componentes Android
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Criar projeto Android
        working-directory: projeto
        run: npx cap add android

      - name: Configurar nome e ícone do aplicativo
        working-directory: projeto
        run: |
          python3 - <<'PY'
          import json

          path = "capacitor.config.json"

          with open(path, "r", encoding="utf-8") as f:
              config = json.load(f)

          config["appName"] = "Riquezas da África"
          config["appId"] = "com.riquezasdaafrica.app"

          with open(path, "w", encoding="utf-8") as f:
              json.dump(config, f, ensure_ascii=False, indent=2)

          PY

      - name: Sincronizar Capacitor
        working-directory: projeto
        run: npx cap sync android

      - name: Configurar nome no Android
        working-directory: projeto
        run: |
          sed -i 's#<string name="app_name">.*</string>#<string name="app_name">Riquezas da África</string>#' android/app/src/main/res/values/strings.xml

      - name: Configurar ícones
        working-directory: projeto
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp public/icons/icon-192.png android/app/src/main/res/drawable/icon.png

      - name: Gerar APK
        working-directory: projeto/android
        run: ./gradlew assembleDebug

      - name: Renomear APK
        run: |
          cp projeto/android/app/build/outputs/apk/debug/app-debug.apk \
             projeto/android/app/build/outputs/apk/debug/Riquezas-da-Africa.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Riquezas-da-Africa
          path: projeto/android/app/build/outputs/apk/debug/Riquezas-da-Africa.apk
