name: Encontrar codigo do mapa

on:
  workflow_dispatch:

jobs:
  procurar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          rm -rf projeto
          unzip -o "riquezas-da-africa-apk-github.zip" -d projeto

      - name: Localizar arquivos
        id: localizar
        run: |
          MAIN=$(find projeto -type f -name "main.jsx" | head -n 1)
          CSS=$(find projeto -type f -name "styles.css" | head -n 1)

          echo "main=$MAIN" >> "$GITHUB_OUTPUT"
          echo "css=$CSS" >> "$GITHUB_OUTPUT"

          echo "MAIN: $MAIN"
          echo "CSS: $CSS"

      - name: Procurar codigo do mapa no main.jsx
        run: |
          echo "=========================================="
          echo "TRECHOS RELACIONADOS AO MAPA"
          echo "=========================================="

          grep -in -E \
          -B 8 -A 15 \
          "marker|point|map|drag|touch|pointer|position|start|leaflet|svg" \
          "${{ steps.localizar.outputs.main }}" \
          | head -n 1200 || true

      - name: Procurar estilos dos pontos e mapa
        run: |
          echo "=========================================="
          echo "TRECHOS RELACIONADOS AOS PONTOS/MAPA NO CSS"
          echo "=========================================="

          grep -in -E \
          -B 8 -A 15 \
          "marker|point|map|drag|touch|pointer|position|start|leaflet|svg" \
          "${{ steps.localizar.outputs.css }}" \
          | head -n 1200 || true
